<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulare</title></head>
<body>
<!-- Netlify Forms: Diese versteckten Formulare registrieren die Felder beim Deploy (Static Export). -->
<form name="aktiv-werden" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="alter"><input name="ort">
  <input name="interessen"><input name="zeit"><textarea name="ueber-mich"></textarea>
  <input name="email"><input name="telefon"><input name="kontaktweg"><input name="datenschutz">
</form>
<form name="kontakt" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="email"><input name="betreff"><textarea name="nachricht"></textarea><input name="datenschutz">
</form>
</body></html>
